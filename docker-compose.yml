services:
  db:
    image: postgres:17-alpine
    container_name: cloud-aws-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appointments_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d appointments_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    name: citas-network

volumes:
  postgres_data:
